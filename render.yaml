services:
  - type: web
    name: san-sim-api
    env: node
    plan: starter
    buildCommand: npm install && npm run build -w @san/api && npm run build -w @san/web
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: san-sim-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: WEB_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAME_SITE
        value: lax
      - key: SERVE_WEB
        value: 'true'
      - key: TRUST_PROXY
        value: 'true'
      - key: QUEUE_ENABLED
        value: 'true'
      - key: EMAIL_TRANSPORT
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        value: SAN SOLUTION
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_REPLY_TO
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: 'false'
      - key: AUTH_EXPOSE_RESET_LINK
        value: 'false'

  - type: worker
    name: san-sim-worker
    env: node
    plan: starter
    buildCommand: npm install && npm run build -w @san/api
    startCommand: node apps/api/dist/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: san-sim-postgres
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: QUEUE_ENABLED
        value: 'true'
      - key: EMAIL_TRANSPORT
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        value: SAN SOLUTION
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_REPLY_TO
        sync: false
      - key: APP_URL
        sync: false

databases:
  - name: san-sim-postgres
    plan: starter
    postgresMajorVersion: '17'
